name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  CACHE_VERSION: 'v1'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format -- --check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ env.CACHE_VERSION }}
          path: dist/
          retention-days: 30

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ env.CACHE_VERSION }}
          path: coverage/
          retention-days: 7

  x402-integration-test:
    name: x402 Integration Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify x402 package
        run: |
          npm list @coinbase/x402
          echo "x402 package verified"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level moderate

  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    needs: [test, x402-integration-test]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Fly CLI
        uses: supercharge/flyctl-actions/setup@v1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Fly.io
        id: deploy
        uses: supercharge/flyctl-actions/deploy@v1
        with:
          args: deploy --image=Dockerfile

      - name: Show deployment info
        run: |
          echo "Deployment completed!"
          echo "URL: ${{ steps.deploy.outputs.url }}"

  notify:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: failure()
    steps:
      - name: Create issue on failure
        uses: JasonEtco/create-an-issue@v2
        with:
          title: 'CI/CD Pipeline Failed - Mining Marketplace'
          body: |
            ## CI/CD Pipeline Failed

            **Repository:** ${{ github.repository }}
            **Branch:** ${{ github.ref }}
            **Commit:** ${{ github.sha }}

            A CI/CD pipeline has failed. Please check the workflow run:

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Failed jobs:
            ${{ needs.lose.outputs.all }}
          labels: 'ci-cd, bug'
          assignees: 'MINING GITHUB INFRA'

  x402-discovery-update:
    name: Update x402 Discovery Surface
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update x402 discovery
        run: |
          echo "Updating x402 discovery surface for mining-marketplace"
          echo "Service registered at: https://mining-marketplace.fly.dev/.well-known/x402"
        env:
          FLY_APP: mining-marketplace